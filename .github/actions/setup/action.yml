name: Set up the workspace
description: >-
  The Qt SDK and C++ toolchain pyside6-scintilla builds against, uv, and (with `sync`) the
  workspace built from source -- both packages, plus the dev tools. The caller checks out first.
  The Qt SDK version lives here, the one place CI names it (see docs/build.md, "Bumping the
  PySide6 minor" -- [tool.cibuildwheel] in packages/pyside6-scintilla/pyproject.toml names it
  too, for the wheel builds).

inputs:
  sync:
    description: Whether to `uv sync` the workspace (building both packages). Off for jobs that only need the Qt SDK.
    required: false
    default: "true"
  python-version:
    description: Python for uv's environment.
    required: false
    default: "3.13"

runs:
  using: composite
  steps:
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: "6.11.1"
        modules: qt5compat
        # aqtinstall 3.3.* can't locate Qt 6.11+ on Windows - the online repo dropped the
        # combined qt6_XXXX/qt6_XXXX/Updates.xml in favor of per-arch dirs
        # (miurahr/aqtinstall#959). Use the patched aqtinstall until a release containing
        # PR #1000 lands on PyPI.
        aqtsource: ${{ runner.os == 'Windows' && 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b' || '' }}

    - name: Set Qt env vars
      shell: bash
      run: |
        echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"
        if [ "${{ runner.os }}" = "Linux" ]; then
          # Qt6Core5Compat isn't bundled with the PySide6 wheel (see docs/bindings.md
          # issue 3), so scintilla_qt's dependency on it must resolve to the
          # aqtinstall'd Qt at runtime.
          echo "LD_LIBRARY_PATH=$QT_ROOT_DIR/lib" >> "$GITHUB_ENV"
        fi

    - name: Install build/runtime dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        # clang/libclang-dev: shiboken6-generator's bundled libclang can't locate its
        # builtin headers (stddef.h etc.) without an external CLANG_INSTALL_DIR - MSVC's
        # headers don't need this. libgl1/libegl1/libxkbcommon0: needed for Qt6Gui to load
        # under QT_QPA_PLATFORM=offscreen for the test suites.
        sudo apt-get install -y clang libclang-dev libgl1 libegl1 libxkbcommon0
        RESOURCE_DIR=$(clang -print-resource-dir)
        echo "Clang resource dir: $RESOURCE_DIR"
        echo "CLANG_INSTALL_DIR=$(dirname "$(dirname "$(dirname "$RESOURCE_DIR")")")" >> "$GITHUB_ENV"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        # Only when syncing: otherwise the cache directory is never created and
        # setup-uv's post-job cache save fails the job.
        enable-cache: ${{ inputs.sync == 'true' }}
        python-version: ${{ inputs.python-version }}

    - name: uv sync
      if: inputs.sync == 'true'
      shell: bash
      # --refresh-package: uv's build cache for a local path dependency isn't keyed off
      # the C++ binding sources, so a plain `uv sync` can silently reuse a stale cached
      # build across cache-restored CI runs instead of recompiling (#11). Refreshing just
      # the two workspace packages still uses the cache for the third-party deps.
      run: uv sync --refresh-package pyside6-scintilla --refresh-package lexilla
