name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # Both packages, built from source in the one workspace venv, on every OS:
  # lexilla's tests (its pyside6-scintilla glue included) always run against
  # this repo's pyside6-scintilla, never the PyPI one.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: from Ubuntu 26.04 (ubuntu-latest
        # since late 2026) libxml2 no longer ships libxml2.so.2, which
        # shiboken6-generator's prebuilt `shiboken6` binary links against
        # ("error while loading shared libraries: libxml2.so.2"; 6.12.0 too).
        # Reported upstream: https://qt-project.atlassian.net/browse/PYSIDE-3504
        # (tracked here as #18: move back to ubuntu-latest once it's fixed).
        # Only the build needs it -- the extension doesn't link libxml2 -- so
        # the `runtime` job below checks the built wheels on 26.04 instead.
        # wheels.yml is unaffected: cibuildwheel builds Linux wheels inside
        # manylinux containers, not on the runner itself.
        os: [ubuntu-24.04, windows-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest

      # The same checks as `make lint` (spelled out: windows-latest has no make).
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run python tools/check_docs_sync.py
          uv run python tools/sync_scintilla_headers.py --check
          uv run python packages/pyside6-scintilla/tools/generate_scintilla_edit.py --check
          uv run pyright

      # For the `runtime` job: wheels from this same build. pyside6-scintilla
      # builds without isolation, reusing .venv and its build directory
      # (about a minute); lexilla builds isolated, as usual.
      - name: Build wheels (for the runtime job)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          uv build --wheel --no-build-isolation --package pyside6-scintilla --out-dir dist
          uv build --wheel --package lexilla --out-dir dist

      - name: Upload wheels
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist/*.whl

  # The build can't run on Ubuntu 26.04 (see the matrix comment above), but
  # users install wheels there: check that the wheels built on 24.04 install
  # and pass both test suites on 26.04, with a newer Python, against the
  # PySide6 wheels from PyPI -- what `pip install` does.
  runtime:
    name: runtime (ubuntu-26.04)
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist

      - name: Install runtime dependencies
        # libgl1/libegl1/libxkbcommon0: needed for PySide6's Qt6Gui to load
        # under QT_QPA_PLATFORM=offscreen, as in the build job. Deliberately
        # *not* libopengl0 (libOpenGL.so.0, absent on 26.04): our libraries
        # don't depend on it (see the WrapOpenGL note in
        # packages/pyside6-scintilla/CMakeLists.txt), and this job checks that.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Install the wheels
        run: |
          uv venv
          uv pip install dist/*.whl pytest pytest-mock pytest-qt

      # test_typing_stubs.py runs pyright over the source tree, a static check
      # the build job already covers (same exclusion as cibuildwheel's
      # test-command). Run from the checkout, but the src/ layouts mean the
      # tests import the installed wheels, not the source trees.
      - name: Run tests against the installed wheels
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          .venv/bin/python -m pytest
          packages/pyside6-scintilla/tests packages/lexilla/tests
          --ignore=packages/pyside6-scintilla/tests/test_typing_stubs.py
