name: Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      # API reference (mkdocstrings) and the changelog/README pages pulled in
      # from the packages.
      - 'packages/*/src/**/*.py'
      - 'packages/*/src/**/*.pyi'
      - 'packages/*/CHANGELOG.md'
      - 'packages/*/README.md'
  pull_request:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      # API reference (mkdocstrings) and the changelog/README pages pulled in
      # from the packages.
      - 'packages/*/src/**/*.py'
      - 'packages/*/src/**/*.pyi'
      - 'packages/*/CHANGELOG.md'
      - 'packages/*/README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --only-group docs: the docs build reads the packages' sources, but
      # doesn't need them built (no Qt/CMake toolchain in this job).
      - run: uv sync --only-group docs

      # --no-sync: `uv run` would otherwise re-sync the default groups and try
      # to build both packages' extensions.
      - run: uv run --no-sync mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
