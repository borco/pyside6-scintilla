site_name: scintilla-py
site_description: Permissively-licensed Python bindings for Scintilla (pyside6-scintilla) and Lexilla (lexilla)
site_url: https://borco.github.io/scintilla-py/
repo_url: https://github.com/borco/scintilla-py
repo_name: borco/scintilla-py
edit_uri: edit/master/docs/

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  # docs/specs/README.md only orients contributors browsing the repo's
  # docs/specs/ directory directly -- mission.md is already in the nav, so
  # it has no separate page on the built site.
  - exclude:
      glob:
        - specs/README.md
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/pyside6-scintilla/src, packages/lexilla/src]
          options:
            # The .pyi stub has no docstrings on individual members (see
            # packages/pyside6-scintilla/tools/generate_pyi.py) - show them anyway, since the signature
            # itself is the documentation for most of this binding's API.
            show_if_no_docstring: true
            # Source shown would be the generated .pyi stub (`def foo(...) -> T: ...`),
            # not the real implementation - not useful to readers.
            show_source: false

theme:
  name: material
  favicon: assets/images/favicon.svg
  icon:
    logo: material/code-braces
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - admonition
  - github-callouts
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # docs/changelog/*.md include each package's CHANGELOG.md (paths relative
  # to the repo root); check_paths makes a moved changelog a build error.
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

