[build-system]
requires = [
    "scikit-build-core>=0.10",
    "nanobind>=2.4",
]
build-backend = "scikit_build_core.build"


[project]
name = "lexilla"
dynamic = ["version"]
description = "Permissively-licensed Python bindings for Lexilla, the lexer library for Scintilla"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ioan Calin", email = "iborco@gmail.com" },
]
keywords = [
    "scintilla",
    "lexilla",
    "lexer",
    "syntax-highlighting",
    "nanobind",
    "code-editor",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Editors",
]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://borco.github.io/lexilla-py/"
Repository = "https://github.com/borco/lexilla-py"
Issues = "https://github.com/borco/lexilla-py/issues"


[tool.scikit-build]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/lexilla"]

# The extension is compiled against Python's limited API (STABLE_ABI in
# src/lexilla/bindings/CMakeLists.txt; nanobind needs CPython >= 3.12 for
# it), so one build works on 3.12+ without a rebuild -- tag it cp312-abi3.
wheel.py-api = "cp312"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/lexilla/__init__.py"


# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]


# ---------------------------------------------------------------------------
# pyright — type-checks the public API surface (src/lexilla) and the tests
# against it.
# ---------------------------------------------------------------------------

[tool.pyright]
# The venv is the workspace's, at the repo root.
include = ["src/lexilla/__init__.py", "tests"]
venvPath = "../.."
venv = ".venv"


# ---------------------------------------------------------------------------
# cibuildwheel — wheel builds. No Qt/external SDK dependency for the build
# itself (unlike pyside6-scintilla), so no before-all SDK install or
# repair-wheel excludes are needed there -- the default
# delocate/auditwheel/delvewheel behavior is fine. The *test* step does pull
# in pyside6-scintilla + pytest-qt to exercise the pyside6_scintilla glue
# module, which needs QT_QPA_PLATFORM=offscreen for headless Qt widget
# creation (same as pyside6-scintilla's own CI).
# ---------------------------------------------------------------------------

[tool.cibuildwheel]
# One cp312-abi3 wheel per platform (wheel.py-api above), forward-compatible
# with 3.13, 3.14, etc. without a rebuild. Python 3.11 was dropped in the
# monorepo move: nanobind's stable ABI needs 3.12, and the separate cp311
# build doubled the wheel count for one Python version.
build = "cp312-win_amd64 cp312-manylinux_x86_64 cp312-manylinux_aarch64 cp312-macosx_arm64 cp312-macosx_x86_64"
# The tests need pyside6-scintilla (for the lexilla.pyside6_scintilla glue):
# the wheel built in the same CI run, which wheels.yml downloads into
# {project}/deps -- see tools/install_pyside6_scintilla.py.
before-test = "python {package}/tools/install_pyside6_scintilla.py {project}/deps"
test-requires = ["pytest>=8.0", "pytest-qt>=4.4"]
test-environment = { QT_QPA_PLATFORM = "offscreen" }
test-command = "pytest {package}/tests"

[tool.cibuildwheel.linux]
# manylinux_2_34 matches pyside6-scintilla's own published wheel tag
# (manylinux_2_34_x86_64) -- the default manylinux_2_28 image's older glibc
# makes that wheel look incompatible to pip, so `pip install
# pyside6-scintilla` (before-test) falls back to building it from
# sdist, which needs a not-yet-released PySide6 build dependency and fails.
manylinux-x86_64-image = "manylinux_2_34"
# manylinux images are missing the system Qt6Gui runtime libs needed to load
# even the offscreen platform plugin (same libs pyside6-scintilla's own CI
# installs via apt on Debian-based runners, here via dnf for the
# manylinux_2_34/AlmaLinux base image).
# (Overrides the global before-test, so it repeats the pyside6-scintilla install.)
before-test = "(dnf install -y mesa-libGL mesa-libEGL libxkbcommon || true) && python {package}/tools/install_pyside6_scintilla.py {project}/deps"
# pyside6-scintilla's aarch64 wheel is tagged manylinux_2_38/manylinux_2_39
# (PySide6's own aarch64 wheels adopted that floor from 6.8.1 onward) --
# the default aarch64 image's older glibc makes it look incompatible to
# pip the same way manylinux_2_34 does for x86_64 above, and building from
# sdist fails the same way too. No manylinux_2_39 shorthand exists in
# cibuildwheel yet, so pin the image directly, by digest for
# reproducibility (same image pyside6-scintilla's own wheels.yml uses).
manylinux-aarch64-image = "quay.io/pypa/manylinux_2_39_aarch64@sha256:e085d763f3d623238f2c197c53d3afdb74351ae57b6ec271637a901dbf2dcb08"

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]
# cibuildwheel's x86_64 default (-mmacosx-version-min=10.9) is too old for
# nanobind's use of aligned operator delete, which needs macOS >=10.13.
# 11.0 also matches the arm64 build's own default, so both archs end up
# with the same deployment target.
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }


